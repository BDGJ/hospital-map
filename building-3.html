<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>แผนผังตึกที่ 3 - ชั้น 1 ถึง 5</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
/* 🌟 บังคับใช้ฟอนต์ Prompt ทั้งหน้าเว็บ */
        body, * {
            font-family: 'Prompt', sans-serif !important;
        }
/* 1. คลุมทั้งหมดให้ไถจอได้ */
/* 3. คืนชีพแผนที่ ให้กลับมาใหญ่เต็มจอเหมือนเดิม! */
        .scroll-wrapper {
            display: block !important;
            width: 100vw !important; /* 🌟 100vw คือกว้างเท่าหน้าจอเป๊ะๆ */
            max-width: 100vw !important;
            margin-left: calc(50% - 50vw) !important; /* 🌟 ดันขอบซ้ายให้ทะลุกรอบออกไป */
            margin-right: calc(50% - 50vw) !important; /* 🌟 ดันขอบขวาให้ทะลุกรอบออกไป */
            padding: 0 !important; 
            position: relative !important;
            z-index: 1 !important;
        }

/* 2. กล่องใส่แผนที่ (ให้กว้างเต็มที่) */
        .map-container {
            width: 100% !important;
            max-width: 100% !important;
            padding: 0 !important;
            margin: 0 !important;
            position: relative !important;
            display: block !important;
        }

/* 3. แก้ไขป๊อปอัปให้แสดงผลสวยงามบนมือถือ */
	.building-popup {
    	    max-width: 250px;     /* จำกัดความกว้างไม่ให้ล้น */
    	    white-space: normal;  /* ยอมให้ข้อความขึ้นบรรทัดใหม่ */
    	    word-wrap: break-word;/* ตัดคำที่ยาวเกินไป */
    	    z-index: 1000;        /* ให้ลอยอยู่เหนือทุกอย่าง */
	}

/* 4. แก้ปุ่มเลือกชั้น (ชั้น 1, 2, 3...) ให้เรียงสวยๆ */
	.button-group { /* หรือคลาสที่คลุมปุ่มของคุณอยู่ */
    	    display: flex;
            width: 100%;
            box-sizing: border-box;
            padding: 0 5px; /* เว้นระยะขอบซ้ายขวานิดนึง */
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f0f0;
            margin: 0;
            padding: 20px;
            text-align: center;
        }

        .back-btn {
            display: inline-block;
            margin-bottom: 20px;
            padding: 10px 20px;
            background-color: #333;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
        }
        .back-btn:hover { background-color: #555; }

/* -------------------------------------
           1. ขยายกล่องพื้นหลังสีขาวให้กว้างเต็มจอ
        ------------------------------------- */
        .content-box {
            max-width: 95%; /* เปลี่ยนจาก 800px เป็น 95% เพื่อให้กว้างเกือบเต็มจอ (เหลือขอบนิดๆ ให้สวยงาม) */
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        h1 { color: #0056b3; margin-top: 0; }

       /* 1. กล่องปุ่ม (เอา overflow ออก เพื่อปลดกรงที่ขังป๊อปอัพออกไป!) */
        .tab-menu {
            display: flex !important;
            flex-direction: row !important;
            flex-wrap: nowrap !important; /* บังคับให้อยู่บรรทัดเดียว */
            justify-content: center !important; /* จัดให้อยู่ตรงกลาง */
            align-items: center !important;
            width: 100% !important;
            margin: 0 auto 20px auto !important;
            padding: 10px !important;
            position: relative !important;
            z-index: 9999 !important; /* ดันให้อยู่หน้าสุด */
            gap: 10px !important; /* เว้นระยะห่างปุ่ม */
            /* ❌ ห้ามมี overflow เด็ดขาด ป๊อปอัพจะได้ทะลุออกมาได้ */
        }
        

        /* -------------------------------------
           ส่วนที่เพิ่มใหม่: ตั้งค่าปุ่มและป๊อปอัป
        ------------------------------------- */
       /* 2. ตัวปุ่ม */
        .tab-btn {
            position: relative !important;
            height: 45px !important;
            padding: 0 25px !important;
            font-size: 16px !important;
            font-weight: bold !important;
            color: #0056b3 !important;
            background-color: white !important;
            border: 2px solid #0056b3 !important;
            border-radius: 5px !important;
            cursor: pointer !important;
            white-space: nowrap !important; /* ตัวหนังสือไม่ขาดท่อน */
            flex: 0 0 auto !important;
        }

        .tab-btn:hover, .tab-btn.active {
            background-color: #0056b3 !important;
            color: white !important;
        }


           /* หน้าตาป๊อปอัป (เวอร์ชันอยู่ข้างล่างและต่อกับปุ่ม) */
        .tab-btn::after {
            content: attr(data-info);
            position: absolute;
            
            /* --- ย้ายมาอยู่ข้างล่าง --- */
            top: 100%;            /* เริ่มจากขอบล่างของปุ่ม */
            left: 50%;
            transform: translateX(-50%);
            margin-top: 10px;     /* เว้นระยะห่างจากปุ่มนิดนึง */
            
            background-color: #222;
            color: #fff;
            padding: 15px 25px;
            font-size: 18px;
            min-width: 200px;
            white-space: pre-line;
            text-align: left;
            line-height: 1.6;
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            
            /* การแสดงผล */
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            z-index: 10;
        }

        /* เพิ่ม "ติ่ง" สามเหลี่ยมชี้ขึ้น (เพื่อให้ดูต่อกับปุ่ม) */
        .tab-btn::before {
            content: "";
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%);
            margin-top: 2px;      /* ให้ติ่งอยู่ระหว่างปุ่มกับป๊อปอัป */
            
            border-width: 8px;
            border-style: solid;
            border-color: transparent transparent #222 transparent; /* สามเหลี่ยมชี้ขึ้น */
            
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            z-index: 11;
        }

        /* สั่งให้โชว์ทั้งป๊อปอัปและติ่งพร้อมกันเมื่อวางเมาส์ */
        .tab-btn:hover::after,
        .tab-btn:hover::before {
            opacity: 1;
            visibility: visible;
            margin-top: 12px;     /* ขยับลงมาพร้อมกันแบบนุ่มๆ */
	}
	.tooltip { 
            position: absolute !important;
            z-index: 99999 !important;
        }
        /* ------------------------------------- */


        /* 3. รูปแผนที่ (บังคับขยาย 100% ตามกล่อง) */
        #floorDisplay, .map-image {
            min-width: 100vw !important; /* 🌟 บังคับขั้นต่ำให้กว้างเท่าหน้าจอ */
            width: 100% !important;
            height: auto !important;
            display: block !important;
            object-fit: cover !important;
        }

/* 🌟 สไตล์ใหม่สำหรับกล่องคำอธิบาย (ใหญ่ขึ้น และอยู่ตรงกลางเหนือแผนที่) */
        /* 🌟 สไตล์กล่องป้าย (ลอยไปขวา โดยไม่กวนปุ่ม) */
        .legend-box {
            position: absolute !important; /* สั่งให้ลอยตัว */
            right: 15px !important;        /* ดันไปชิดขวา (เว้นขอบนิดนึงจะได้สวย) */
            top: 22px !important;          /* ให้อยู่กึ่งกลางบรรทัดพอดีกับปุ่ม */
            transform: translateY(-50%) !important; 
            
            display: flex !important;
            align-items: center !important;
            padding: 10px 20px !important; 
            background-color: white !important;
            border-radius: 8px !important;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15) !important;
            z-index: 10 !important;
            margin: 0 !important;
        }

        /* 🌟 สไตล์ใหม่สำหรับวงกลมสีน้ำเงิน (ใหญ่ขึ้น) */
        .blue-circle {
            width: 25px !important; /* 🌟 ขยายขนาดวงกลมเป็น 25px */
            height: 25px !important;
            background-color: #436ab2 !important;
            border-radius: 50% !important;
            display: inline-block !important;
            margin-right: 15px !important; /* เว้นระยะห่างจากข้อความมากขึ้น */
        }
        
        /* 🌟 ขยายขนาดตัวหนังสือคำอธิบาย */
        .legend-box span {
            font-size: 18px !important; /* 🌟 ปรับขนาดตัวหนังสือให้ใหญ่ขึ้น 18px */
            font-weight: bold !important;
            color: #333 !important;
        }

/* 🌟 โค้ดนี้จะทำงานเฉพาะจอมือถือ (จอเล็กกว่า 768px) */
        /* 🌟 ป้องกันพังในมือถือ: ถ้าจอเล็กมากๆ ให้ป้ายมันตกลงมาข้างล่าง จะได้ไม่ทับปุ่ม */
        @media (max-width: 1024px) {
            .legend-box {
                position: relative !important;
                right: auto !important;
                top: auto !important;
                transform: none !important;
                justify-content: center !important;
                margin: 0 auto 20px auto !important;
                width: fit-content !important;
            }
        }

    </style>
</head>
<body>

    <a href="index.html" class="back-btn">⬅ กลับไปหน้าแผนที่รวม</a>

    <div class="scroll-wrapper">

    <div class="content-box">
        <h1>อาคารศูนย์การแพทย์กาญจนาภิเษก</h1>
        <p>เอาเมาส์ชี้เพื่อดูข้อมูลแต่ละชั้น และคลิกเพื่อดูแผนผัง</p>


    <div style="display: block; width: 100%;">        

    <div style="position: relative; width: 100%;">

        <div class="tab-menu">
            
            <button class="tab-btn active" 
                    data-info="• เภสัชกรรม&#10;• หัตถการต่อเนื่อง (OPD Trauma)&#10;• คลินิกโรคติดเชื้อทางเดินหายใจ (ARI)&#10;• หออภิบาลผู้ป่วยหัวใจและหลอดเลือด (CVU)&#10;• เวชภัณฑ์ทางการแพทย์&#10;• เวชภัณฑ์ปลอดเชื้อ (CSSD)&#10;• เวชศาสตร์ฟื้นฟู&#10;• กายภาพบำบัด" 
                    onclick="changeFloor('floor1.jpg', this)">ชั้น 1
            </button>

            <button class="tab-btn" 
                    data-info="• การเงินผู้ป่วยนอก&#10;• Admission&#10;• อุบัติเหตุและฉุกเฉิน (ER)&#10;• ออร์โธปิดิกส์ (Orthopedics)&#10;• รังสีเทคนิค (X-Ray)&#10;• ศัลยกรรม&#10;• อายุรกรรม" 
                    onclick="changeFloor('floor2.jpg', this)">ชั้น 2
            </button>

            <button class="tab-btn" 
                    data-info="• เวชสถิติ&#10;• หน่วยไตเทียม&#10;• ล้างไตทางช่องท้อง&#10;• ICU 1&#10;• ผ่าตัด (OR)&#10;• หอผู้ป่วย 3 (Ward 3)" 
                    onclick="changeFloor('floor3.jpg', this)">ชั้น 3
            </button>

            <button class="tab-btn" 
                    data-info="• งานเวชสารสนเทศ&#10;• เคมีบำบัดระยะสั้น&#10;• หน่วยสื่อสารผู้ป่วยสัมพันธ์&#10;• สำนักงานฝ่ายการพยาบาล&#10;• สำนักงานผู้อำนวยการ&#10;• เลขานุการฝ่ายการแพทย์&#10;• ฝ่ายการแพทย์&#10;• หอผู้ป่วย 4A (Ward 4A)&#10;• หอผู้ป่วย 4B (Ward 4B)" 
                    onclick="changeFloor('floor4.jpg', this)">ชั้น 4
            </button>

	    <button class="tab-btn" 
                    data-info="• งานสื่อสารองค์กร&#10;• คลังเวชระเบียน&#10;• หอพักบุคลากร&#10;• หอผู้ป่วย 5 (Ward 5)" 
                    onclick="changeFloor('floor5.jpg', this)">ชั้น 5
            </button>
        </div>

	

              <div class="legend-box">
                <span class="blue-circle"></span>
                <span>แทน ตำแหน่งของ Access Control</span>
              </div>

	      <div class="scroll-wrapper">
                <div class="map-container">

                  <img id="floorDisplay" class="map-image" src="floor1.jpg" alt="แผนผัง">

                </div>
              </div>

        </div>

    <script>
        function changeFloor(imageName, btn) {
            document.getElementById('floorDisplay').src = imageName;
            const tabs = document.querySelectorAll('.tab-btn');
            tabs.forEach(tab => tab.classList.remove('active'));
            btn.classList.add('active');
        }
    </script>

</body>
</html>
